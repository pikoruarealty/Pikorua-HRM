# Pre-certbot TEMPLATE. After `certbot --nginx` the live file on the VPS differs:
# port 80 only redirects to HTTPS and this proxy block moves to the 443 server.
# deploy/hostinger-deploy.sh therefore health-checks over HTTPS, not port 80.
server {
    listen 80;
    server_name hrm.pikoruarealty.com;

    location / {
        include /opt/pikorua-hrm/proxy.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
