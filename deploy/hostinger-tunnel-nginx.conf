# Install as /etc/nginx/conf.d/hrm-tunnel.conf on the VPS, then `nginx -t && systemctl reload nginx`.
#
# The Cloudflare Tunnel must point at THIS fixed port (http://127.0.0.1:8088), never at an app
# port. Blue and green listen on 3001 / 3002 and the active one changes with every release
# (proxy.conf is what flips); a tunnel aimed at one slot goes down the first time the other
# becomes active (2026-10-24: the release moved to green, the tunnel still pointed at blue ->
# Cloudflare 502). Bound to loopback only, so it is not reachable from outside the VPS.
# Use 127.0.0.1, not "localhost" — localhost can resolve to ::1 and nothing listens there.
server {
    listen 127.0.0.1:8088;
    server_name _;

    location / {
        include /opt/pikorua-hrm/proxy.conf;
        proxy_http_version 1.1;
        proxy_set_header Host hrm.pikoruarealty.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The login cookie is Secure: the app must see that the visitor used HTTPS.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
